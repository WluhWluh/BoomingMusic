name: Android CI

on:
  workflow_dispatch:
  push:
    branches-ignore: [ "stable" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "assets/"
      - "metadata/"
      - '.gitignore'
      - "*.md"
      - "LICENSE.txt"
  pull_request:
    branches-ignore: [ "stable" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "assets/"
      - "metadata/"
      - '.gitignore'
      - "*.md"
      - "LICENSE.txt"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'
        cache: gradle

    - name: Create files for signing
      if: github.event_name != 'pull_request'
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
      run: |
        if [ -n "$SIGNING_KEY" ] && [ -n "$SIGNING_PROPERTIES" ]; then
          printf '%s' "$SIGNING_KEY" | base64 -d > ./booming_keystore.jks
          printf '%s' "$SIGNING_PROPERTIES" | base64 -d > ./keystore.properties
        else
          echo "Signing secrets are not configured; release builds will use the debug signing fallback."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          ./gradlew assembleNormalDebug
        else
          ./gradlew assembleNormalRelease
        fi
      env:
        RELEASE_TYPE: "CI"
        EVENT_NAME: ${{ github.event_name }}

    - name: Create Changelog
      id: changelog
      if: github.event_name != 'pull_request'
      uses: actions/github-script@v9
      env:
        COMMITS: ${{ toJSON(github.event.commits) }}
      with:
        result-encoding: string
        script: |
          const commits = JSON.parse(process.env.COMMITS || "[]") || [];
          if (!Array.isArray(commits) || commits.length === 0) {
            return `- Manual build for ${context.ref}`;
          }

          return commits
            .map(commit => `- ${commit.message.split("\n")[0]}`)
            .join("\n");

    - name: Find APK (CI build)
      if: github.event_name != 'pull_request'
      run: |
        APK_PATH=$(find app/build/outputs/apk/normal/release -name 'BoomingSS-*.apk' | sort | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "No Booming SS release APK found." >&2
          exit 1
        fi
        echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
        echo "APK_FILE_NAME=$(basename $APK_PATH .apk)" >> $GITHUB_ENV

    - name: Check Telegram configuration
      id: telegram
      if: github.event_name != 'pull_request'
      env:
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_API_ID: ${{ secrets.TG_API_ID }}
        TG_API_HASH: ${{ secrets.TG_API_HASH }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      run: |
        if [ -n "$TG_CHAT_ID" ] && [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ] && [ -n "$TG_BOT_TOKEN" ]; then
          echo "enabled=true" >> $GITHUB_OUTPUT
        else
          echo "enabled=false" >> $GITHUB_OUTPUT
          echo "Telegram secrets are not configured; skipping Telegram upload."
        fi

    - name: Find APK (PR)
      if: github.event_name == 'pull_request'
      run: |
        APK_PATH=$(find app/build/outputs/apk/normal/debug -name 'BoomingSS-*.apk' | sort | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "No Booming SS debug APK found." >&2
          exit 1
        fi
        echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
        echo "APK_FILE_NAME=$(basename $APK_PATH .apk)" >> $GITHUB_ENV

    - name: Send files to Telegram
      if: github.event_name != 'pull_request' && steps.telegram.outputs.enabled == 'true'
      uses: xz-dev/TelegramFileUploader@v1
      with:
        to-who: ${{ secrets.TG_CHAT_ID }}
        message: |
          📋 **Changelog:**
          ${{ env.CHANGELOG }}
        files: |
          ${{ env.APK_FILE }}
      env:
        CHANGELOG: ${{ steps.changelog.outputs.result }}
        API_ID: ${{ secrets.TG_API_ID }}
        API_HASH: ${{ secrets.TG_API_HASH }}
        BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}

    - name: Upload apk (CI build)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APK_FILE_NAME }}
        path: ${{ env.APK_FILE }}
        archive: false

    - name: Upload apk (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APK_FILE_NAME }}
        path: ${{ env.APK_FILE }}
