name: Build Release APK

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [ github, fdroid ]

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android-SDK
        uses: android-actions/setup-android@v4

      - name: Create files for signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$SIGNING_PROPERTIES" ]; then
            printf '%s' "$SIGNING_KEY" | base64 -d > ./booming_keystore.jks
            printf '%s' "$SIGNING_PROPERTIES" | base64 -d > ./keystore.properties
          else
            echo "Signing secrets are not configured; release builds will use the debug signing fallback."
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build app
        env:
          VARIANT: ${{ matrix.variant }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          CAP_VARIANT="$(echo ${VARIANT:0:1} | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          ./gradlew assemble${CAP_VARIANT}Release

      - name: Verify LiteRT native supply chain and APK inventories
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python -m unittest discover -s tools -p "test_verify_litert_native.py"
          python tools/verify_litert_native.py
          python tools/verify_litert_apks.py "app/build/outputs/apk/${VARIANT}/release"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.variant }}-release
          path: |
            app/build/outputs/apk/*/release/BoomingSS-*.apk

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    if: > # TEMPORARY: Prevent releases for alpha/beta/rc tags.
      !contains(github.ref_name, 'alpha') && 
      !contains(github.ref_name, 'beta') && 
      !contains(github.ref_name, 'rc')

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: artifacts-*-release
          merge-multiple: true

      - name: Set prerelease flag
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Github Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
          files: |
            release-artifacts/*/release/BoomingSS-*.apk
